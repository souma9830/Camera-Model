<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eco Chain – Waste Deposit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

:root {
  --bg: #ffffff;
  --surface: #111827;
  --glass: rgba(255, 255, 255, 0.04);
  --border: rgba(255, 255, 255, 0.08);
  --accent: rgb(8, 216, 112);
  --accent2: #64c486b7;
  --success: #10b981;
  --danger: #ef4444;
  --text: #000000;
  --muted: #94a3b8;
}

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient blobs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: var(--accent2);
      top: -150px;
      left: -150px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: var(--accent);
      bottom: -120px;
      right: -120px;
    }

    /* ─── Card ─── */
    .card {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: min(440px, 95vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
    }

    h1 span {
      color: var(--accent);
    }

    /* ─── UID select phase ─── */
    #uid-phase {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      transition: opacity .4s, transform .4s;
    }

    #uid-phase.hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      transform: translateY(-20px);
    }

    .select-wrap {
      position: relative;
      width: 100%;
    }

    .select-wrap label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: .5rem;
    }

    select {
      width: 100%;
      appearance: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem 3rem .85rem 1.1rem;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }

    select:focus,
    select:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .12);
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 1.1rem;
      bottom: .9rem;
      color: var(--muted);
      pointer-events: none;
    }

    /* ─── Camera phase ─── */
    #camera-phase {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
    }

    #camera-phase.active {
      display: flex;
    }

    /* UID badge */
    .uid-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: rgba(34, 211, 238, .08);
      border: 1px solid rgba(34, 211, 238, .25);
      border-radius: 999px;
      padding: .35rem .9rem;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .uid-badge span {
      color: var(--text);
      letter-spacing: .12em;
    }

    /* Camera view */
    .camera-container {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      box-shadow: 0 0 0 2px var(--border), 0 20px 60px rgba(0, 0, 0, .5);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #canvas {
      display: none;
    }

    /* Corner brackets */
    .bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--accent);
      border-style: solid;
      opacity: .6;
    }

    .bracket.tl {
      top: 10px;
      left: 10px;
      border-width: 2px 0 0 2px;
    }

    .bracket.tr {
      top: 10px;
      right: 10px;
      border-width: 2px 2px 0 0;
    }

    .bracket.bl {
      bottom: 10px;
      left: 10px;
      border-width: 0 0 2px 2px;
    }

    .bracket.br {
      bottom: 10px;
      right: 10px;
      border-width: 0 2px 2px 0;
    }

    /* Scan line animation */
    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan 2.5s linear infinite;
      opacity: .4;
    }

    @keyframes scan {
      0% {
        top: 10%;
      }

      100% {
        top: 90%;
      }
    }

    /* Preview */
    #preview-wrap {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: .8rem;
    }

    #preview-wrap.active {
      display: flex;
    }

    #preview {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    .preview-label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: .85rem 2rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      width: 100%;
      letter-spacing: .03em;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 8px 30px rgba(34, 211, 238, .25);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 12px 40px rgba(34, 211, 238, .4);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success), #059669);
      color: #fff;
      box-shadow: 0 8px 30px rgba(16, 185, 129, .25);
    }

    .btn-success:hover:not(:disabled) {
      box-shadow: 0 12px 40px rgba(16, 185, 129, .4);
    }

    .btn-ghost {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Icon SVG */
    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Status toast */
    #status {
      display: none;
      align-items: center;
      gap: .55rem;
      font-size: .82rem;
      font-weight: 500;
      padding: .7rem 1rem;
      border-radius: 10px;
      width: 100%;
      text-align: center;
    }

    #status.show {
      display: flex;
      justify-content: center;
    }

    #status.ok {
      background: rgba(16, 185, 129, .12);
      border: 1px solid rgba(16, 185, 129, .3);
      color: var(--success);
    }

    #status.err {
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .3);
      color: var(--danger);
    }

    #status.loading {
      background: rgba(34, 211, 238, .08);
      border: 1px solid rgba(34, 211, 238, .2);
      color: var(--accent);
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Proceed btn */
    #proceed-btn {
      position: relative;
      overflow: hidden;
    }

    #proceed-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .12) 50%, transparent 100%);
      transform: translateX(-100%);
    }

    #proceed-btn:not(:disabled):hover::after {
      animation: shimmer .6s ease forwards;
    }

    @keyframes shimmer {
      to {
        transform: translateX(100%);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">Eco Chain</div>

    <h1>Waste <span>Deposit</span> Station</h1>

    <!-- ── Phase 1: UID Selection ── -->
    <div id="uid-phase">
      <div class="select-wrap">
        <label>Select your Student UID</label>
        <select id="uid-select">
          <option value="" disabled selected>— choose your UID —</option>
          <option value="61cf2417">61cf2417</option>
          <option value="d4c55006">d4c55006</option>
          <option value="rride">rride</option>
        </select>
      </div>

      <button class="btn btn-primary" id="proceed-btn" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
        Open Camera
      </button>
    </div>

    <!-- ── Phase 2: Camera ── -->
    <div id="camera-phase">
      <div class="uid-badge">
        UID &nbsp;·&nbsp; <span id="uid-display"></span>
      </div>

      <!-- Live video -->
      <div id="live-wrap" class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        <div class="scan-line"></div>
      </div>

      <!-- Frozen preview after capture -->
      <div id="preview-wrap">
        <img id="preview" alt="Captured photo" />
        <div class="preview-label">📸 Photo captured — ready to send</div>
      </div>

      <canvas id="canvas"></canvas>

      <!-- Capture button -->
      <button class="btn btn-primary" id="capture-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
        Take Photo
      </button>

      <!-- Send button (appears after capture) -->
      <button class="btn btn-success" id="send-btn" style="display:none;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Send Photo
      </button>

      <!-- Retake button -->
      <button class="btn btn-ghost" id="retake-btn" style="display:none;">↩ Retake</button>
    </div>

    <!-- Status toast -->
    <div id="status"></div>
  </div>

  <script>
    /* ── State ── */
    let selectedUID = '';
    let capturedBlob = null;
    let stream = null;

    /* ── Elements ── */
    const uidSelect = document.getElementById('uid-select');
    const proceedBtn = document.getElementById('proceed-btn');
    const uidPhase = document.getElementById('uid-phase');
    const cameraPhase = document.getElementById('camera-phase');
    const uidDisplay = document.getElementById('uid-display');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const liveWrap = document.getElementById('live-wrap');
    const previewWrap = document.getElementById('preview-wrap');
    const preview = document.getElementById('preview');
    const captureBtn = document.getElementById('capture-btn');
    const sendBtn = document.getElementById('send-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const statusEl = document.getElementById('status');

    /* ── Enable proceed when UID chosen ── */
    uidSelect.addEventListener('change', () => {
      proceedBtn.disabled = !uidSelect.value;
    });

    /* ── Proceed: hide select, open camera ── */
    proceedBtn.addEventListener('click', async () => {
      selectedUID = uidSelect.value;
      if (!selectedUID) return;

      uidPhase.classList.add('hidden');
      setTimeout(() => { uidPhase.style.display = 'none'; }, 400);

      cameraPhase.classList.add('active');
      uidDisplay.textContent = selectedUID;

      await startCamera();
    });

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        // Wait until video is actually playing so videoWidth/Height are correct
        await new Promise(resolve => { video.onplaying = resolve; });
      } catch (err) {
        showStatus('Camera access denied: ' + err.message, 'err');
      }
    }

    /* ── Capture: prefer ImageCapture API (avoids canvas cross-origin taint on file://) ── */
    captureBtn.addEventListener('click', async () => {
      if (!stream) return;
      captureBtn.disabled = true;

      try {
        let blob = null;

        // Best path: ImageCapture gives a clean Blob directly from the hardware track
        const track = stream.getVideoTracks()[0];
        if (track && typeof ImageCapture !== 'undefined') {
          try {
            const ic = new ImageCapture(track);
            blob = await ic.takePhoto();
            console.log('[capture] ImageCapture blob:', blob.type, blob.size);
          } catch (icErr) {
            console.warn('[capture] ImageCapture failed, using canvas fallback:', icErr.message);
          }
        }

        // Fallback: draw current video frame onto canvas
        if (!blob) {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
          blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
          console.log('[capture] canvas blob:', blob ? blob.type : 'null', blob ? blob.size : 0);
        }

        if (!blob || blob.size === 0) {
          showStatus('❌ Capture failed — blob is empty. Try refreshing.', 'err');
          captureBtn.disabled = false;
          return;
        }

        // Normalise to JPEG (ImageCapture may return image/png on some browsers)
        if (!blob.type.includes('jpeg')) {
          const bmp = await createImageBitmap(blob);
          canvas.width = bmp.width;
          canvas.height = bmp.height;
          canvas.getContext('2d').drawImage(bmp, 0, 0);
          blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
        }

        capturedBlob = blob;
        console.log('[capture] final blob — type:', capturedBlob.type, '| size:', capturedBlob.size, 'bytes');

        preview.src = URL.createObjectURL(capturedBlob);
        liveWrap.style.display = 'none';
        previewWrap.classList.add('active');
        captureBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        retakeBtn.style.display = 'flex';
      } catch (err) {
        showStatus('❌ Capture error: ' + err.message, 'err');
      } finally {
        captureBtn.disabled = false;
      }
    });

    /* ── Retake ── */
    retakeBtn.addEventListener('click', () => {
      capturedBlob = null;
      previewWrap.classList.remove('active');
      liveWrap.style.display = 'block';
      captureBtn.style.display = 'flex';
      sendBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      clearStatus();
    });

    /* ── Send ── */
    sendBtn.addEventListener('click', async () => {
      if (!capturedBlob) {
        showStatus('❌ No photo captured yet.', 'err');
        return;
      }
      if (!selectedUID) {
        showStatus('❌ UID is missing.', 'err');
        return;
      }

      sendBtn.disabled = true;
      retakeBtn.disabled = true;
      showStatus('Uploading…', 'loading', true);

      const formData = new FormData();
      formData.append('uid', selectedUID);
      formData.append('image', capturedBlob, 'deposit.jpg');

      // ── Debug: verify FormData payload in DevTools console ──
      console.log('[send] uid =', selectedUID);
      console.log('[send] photo blob =', capturedBlob.size, 'bytes,', capturedBlob.type);
      for (const [k, v] of formData.entries()) {
        console.log('[formData]', k, '->', v instanceof Blob
          ? `Blob { size: ${v.size}, type: "${v.type}" }`
          : v);
      }

      try {
        // ⚠️  Do NOT set Content-Type manually — fetch auto-adds the correct
        //    multipart/form-data boundary when body is FormData.
        const res = await fetch('https://green-coin-backend-1.onrender.com/api/iot/deposit/complete', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json().catch(() => ({}));
        console.log('[response]', res.status, data);

        if (res.ok) {
          showStatus('✅ Deposit submitted successfully!', 'ok');
          setTimeout(resetAll, 3500);
        } else {
          showStatus('❌ Server error: ' + (data.message || res.statusText), 'err');
          sendBtn.disabled = false;
          retakeBtn.disabled = false;
        }
      } catch (err) {
        showStatus('❌ Network error: ' + err.message, 'err');
        sendBtn.disabled = false;
        retakeBtn.disabled = false;
      }
    });

    /* ── Helpers ── */
    function showStatus(msg, type, spinner = false) {
      statusEl.innerHTML = spinner
        ? `<div class="spinner"></div>${msg}`
        : msg;
      statusEl.className = `show ${type}`;
    }
    function clearStatus() {
      statusEl.className = '';
      statusEl.innerHTML = '';
    }

    function resetAll() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      capturedBlob = null;
      selectedUID = '';
      uidSelect.value = '';
      proceedBtn.disabled = true;
      previewWrap.classList.remove('active');
      liveWrap.style.display = 'block';
      captureBtn.style.display = 'flex';
      sendBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      sendBtn.disabled = false;
      retakeBtn.disabled = false;
      cameraPhase.classList.remove('active');
      uidPhase.style.display = '';
      setTimeout(() => uidPhase.classList.remove('hidden'), 10);
      clearStatus();
    }
  </script>
</body>

</html>
